<text x="64" y="244" font-size="13" font-weight="bold" fill="#39423A">B1 阶段 · 可擦除语法（改动局限 parser 层，完成即可独立交付）</text>
<rect x="64" y="256" width="572" height="40" rx="10" fill="#FFFDF9" stroke="#E7DECA"/>
<circle cx="88" cy="276" r="11" fill="#6E9273"/><text x="88" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">1</text>
<text x="108" y="273" font-size="11.5" font-weight="bold" fill="#39423A">M1 ts_mode 骨架 + 类型注解</text>
<text x="108" y="288" font-size="9.5" fill="#6B7266">4 插入点:28515 变量 / 24455 函数 / 25274 类 / 26338 解构</text>
<rect x="64" y="304" width="572" height="40" rx="10" fill="#FFFDF9" stroke="#E7DECA"/>
<circle cx="88" cy="324" r="11" fill="#6E9273"/><text x="88" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">2</text>
<text x="108" y="321" font-size="11.5" font-weight="bold" fill="#8C4A3A">M2 泛型与断言 · 歧义消解核心（风险最高）</text>
<text x="108" y="336" font-size="9.5" fill="#6B7266">f&lt;T&gt;(x) vs a&lt;b — 回溯试探+失败回退，复用 24745/24752</text>
<rect x="64" y="352" width="572" height="40" rx="10" fill="#FFFDF9" stroke="#E7DECA"/>
<circle cx="88" cy="372" r="11" fill="#6E9273"/><text x="88" y="376" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">3</text>
<text x="108" y="369" font-size="11.5" font-weight="bold" fill="#39423A">M3 类型声明 interface / type / declare</text>
<text x="108" y="384" font-size="9.5" fill="#6B7266">整体消费丢弃 → B1 完成，可独立交付价值</text>
<line x1="350" y1="402" x2="350" y2="426" stroke="#8A8272" stroke-width="2" marker-end="url(#ah)"/>

<rect x="44" y="432" width="612" height="182" rx="14" fill="#F4E6DF"/>
<text x="64" y="456" font-size="13" font-weight="bold" fill="#4A3B34">B2 阶段 · 生成运行时代码（触及字节码生成层，不新增 opcode）</text>
<rect x="64" y="468" width="572" height="40" rx="10" fill="#FFFDF9" stroke="#E7DECA"/>
<circle cx="88" cy="488" r="11" fill="#B0705C"/><text x="88" y="492" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">4</text>
<text x="108" y="485" font-size="11.5" font-weight="bold" fill="#4A3B34">M4 enum + const enum（首个生成代码）</text>
<text x="108" y="500" font-size="9.5" fill="#6B7266">降级为对象+正反向映射；const enum 编译期内联；字节码 dump 对比</text>
<rect x="64" y="516" width="572" height="40" rx="10" fill="#FFFDF9" stroke="#E7DECA"/>
<circle cx="88" cy="536" r="11" fill="#B0705C"/><text x="88" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">5</text>
<text x="108" y="533" font-size="11.5" font-weight="bold" fill="#4A3B34">M5 参数属性 + namespace</text>
<text x="108" y="548" font-size="9.5" fill="#6B7266">借鉴 emit_class_field_init(25184) 注入 this.x=x；namespace→IIFE</text>
<rect x="64" y="564" width="572" height="40" rx="10" fill="#FFFDF9" stroke="#E7DECA"/>
<circle cx="88" cy="584" r="11" fill="#B0705C"/><text x="88" y="588" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">6</text>
<text x="108" y="581" font-size="11.5" font-weight="bold" fill="#4A3B34">M6 装饰器</text>
<text x="108" y="596" font-size="9.5" fill="#6B7266">入口须 grill 确认语义版本：TC39 stage3 vs TS legacy（不兼容）</text>
<line x1="350" y1="614" x2="350" y2="638" stroke="#8A8272" stroke-width="2" marker-end="url(#ah)"/>

<rect x="44" y="644" width="612" height="72" rx="14" fill="#F1E9D2"/>
<circle cx="76" cy="670" r="13" fill="#9A8B5F"/>
<text x="76" y="675" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">7</text>
<text x="98" y="675" font-size="14" font-weight="bold" fill="#4A4436">M7 集成与端到端（唯一允许串联用例）</text>
<rect x="64" y="686" width="572" height="22" rx="7" fill="#FFFDF9" stroke="#E7DECA"/>
<text x="76" y="701" font-size="9.5" fill="#5C5648">.ts 扩展名识别 + CLI · 与前置 RFC F2/F3 组合 = TS 编译期 AOT + 运行期零 parser</text>

<rect x="44" y="726" width="612" height="52" rx="12" fill="#E4EDE4"/>
<text x="64" y="748" font-size="11.5" font-weight="bold" fill="#3A4A3A">复用的现有基础设施（P2 路径成立的根据）</text>
<text x="64" y="766" font-size="10" fill="#54604F">回溯 js_parse_get_pos/seek_token(24745/24752) · lookahead skip_parens_token(24800) · emit 原语(23837-23974) · define_var(24303)</text>

<rect x="44" y="788" width="612" height="48" rx="12" fill="#EFDFDF"/>
<text x="64" y="810" font-size="11.5" font-weight="bold" fill="#5A4040">关键约束</text>
<text x="64" y="827" font-size="10" fill="#6B4E4E">S1 零回归(ts_mode 默认关，test262 零新增失败) · S2 不做类型检查 · S3 不新增 opcode/不改 BC_VERSION · S8 不以性能为立项理由</text>
</svg>
