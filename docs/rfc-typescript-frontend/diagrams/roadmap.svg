<svg width="100%" viewBox="0 0 700 860" role="img" xmlns="http://www.w3.org/2000/svg">
<title>QuickJS 原生 TypeScript 前端 · 技术路线图</title>
<desc>插画风技术路线图:M0 设计评审 → B1 阶段(M1-M3 可擦除语法,仅 parser 层) → B2 阶段(M4-M6 生成运行时代码,触及字节码层) → M7 集成;底部为关键约束与复用基础设施。</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8272"/></marker>
</defs>
<rect x="24" y="8" width="652" height="844" rx="18" fill="#FAF6EC" stroke="#E3D9C4" stroke-width="1.5"/>
<rect x="44" y="28" width="612" height="58" rx="12" fill="#AFC0D2"/>
<text x="350" y="53" text-anchor="middle" font-size="16" font-weight="bold" fill="#2F3B4A">QuickJS 原生 TypeScript 前端 · 技术路线图</text>
<text x="350" y="73" text-anchor="middle" font-size="11" fill="#3E4E62">覆盖范围 B:可擦除语法 + 生成运行时代码 · 基线 HEAD 04be246</text>

<rect x="44" y="104" width="612" height="86" rx="14" fill="#DCE7F2"/>
<circle cx="76" cy="130" r="13" fill="#5B7A9D"/>
<text x="76" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">0</text>
<text x="98" y="135" font-size="14" font-weight="bold" fill="#39424E">M0 设计与独立评审</text>
<rect x="64" y="150" width="286" height="30" rx="8" fill="#FFFDF9" stroke="#E7DECA"/>
<text x="76" y="170" font-size="14">🔍</text><text x="98" y="170" font-size="10.5" fill="#4A4A42">摸底:回溯设施 + emit 原语已备</text>
<rect x="364" y="150" width="276" height="30" rx="8" fill="#FFFDF9" stroke="#E7DECA"/>
<text x="376" y="170" font-size="14">🧑‍⚖️</text><text x="402" y="170" font-size="10.5" fill="#4A4A42">两模型对抗评审 → 定稿</text>
<line x1="350" y1="190" x2="350" y2="214" stroke="#8A8272" stroke-width="2" marker-end="url(#ah)"/>

